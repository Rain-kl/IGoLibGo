        in: path
        name: id
        required: true
        type: integer
      - description: 更新认证源参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contracts.AuthSourceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功，返回更新后的认证源信息
          schema:
            $ref: '#/definitions/response.Any'
        "400":
          description: 参数错误或验证失败
          schema:
            $ref: '#/definitions/response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/response.Any'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/response.Any'
      security:
      - SessionCookie: []
      summary: 更新认证源
      tags:
      - admin
  /api/v1/admin/auth-sources/{id}/toggle:
    put:
      consumes:
      - application/json
      description: 启用或禁用指定认证源。尝试启用时将验证 Client ID 和 Client Secret 是否已配置，需要管理员权限
      parameters:
      - description: 认证源 ID 或名称
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
