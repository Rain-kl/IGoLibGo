name: ESLint

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches:
      - "dev"
      - "main"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend
        run: bunx eslint . --max-warnings 0
